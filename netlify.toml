# Site statique : aucun build, Netlify publie le dossier tel quel
[build]
  publish = "."

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# L'espace admin ne doit pas apparaître dans les moteurs de recherche
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
